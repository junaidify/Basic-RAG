[project]
name = "basic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Junaid Khan" }
]
requires-python = ">=3.13"
dependencies = [
    "bre>=0.1",
    "faiss-cpu>=1.16.0",
    "groq>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.3.0",
    "langchain-text-splitters>=1.2.0",
    "pathlib>=1.0.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
basic-rag = "basic_rag:main"
bre = "basic_rag.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
